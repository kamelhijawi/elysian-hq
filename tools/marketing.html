const tag=(label,tone='')=>`<span class="tag ${tone}">${esc(label)}</span>`;
const shortDate=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return 'No date';return new Date(s.slice(0,10)+'T12:00:00+04:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Asia/Dubai'})};
const time=s=>s?new Date(s).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'}):'On demand';
const match=r=>!query||Object.values(r).filter(v=>typeof v==='string').join(' ').toLowerCase().includes(query);
function navigate(next,nextFilter='all'){view=next;filter=nextFilter;query='';$('#search').value='';history.replaceState(null,'','#'+view);render();window.scrollTo({top:0,behavior:'instant'})}
function nav(){ $('#nav').innerHTML=views.map(([id,title,i])=>`<button data-nav="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(i)}${title}${id==='production'&&data?`<span class="nav-count">${data.counts.open}</span>`:''}</button>`).join('') }
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
const heading=(title,subtitle,action='')=>`<div class="page-heading"><div><div class="eyebrow">Moon Shelter / Marketing</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;
const sectionHead=(title,action='')=>`<div class="section-head"><h2>${title}</h2>${action}</div>`;
const go=(title,target,f='all')=>`<button class="text-button" data-nav="${target}" data-filter="${f}">${title}${icon('arrow')}</button>`;
function runButton(job,label){return `<button class="button primary" data-run="${job}" ${pending.has(job)||data?.jobs[job]?.state==='run'?'disabled':''}>${icon('spark')}${pending.has(job)||data?.jobs[job]?.state==='run'?'Working…':label}</button>`}
const sortedWork=()=>data.production.filter(match).sort((a,b)=>Number(b.overdue)-Number(a.overdue)||a.due.localeCompare(b.due)||a.id.localeCompare(b.id));
function workTable(rows){if(!rows.length)return '<div class="empty">No production orders match this view.</div>';return `<div class="table-wrap"><table><thead><tr><th>Work order</th><th>Owner</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="work-name" data-work="${esc(r.id)}">${esc(r.name)}</button><div class="work-sub">${esc(r.id)} · ${esc(r.type==='video'?'Video':'Placement')}</div></td><td>${r.unassigned?tag('Needs owner','amber'):`<span class="due">${esc(r.owner)}</span>`}</td><td class="due ${r.overdue?'late':''}">${shortDate(r.due)}${r.overdue?'<div class="work-sub" style="color:inherit">Overdue</div>':''}</td><td>${tag(r.state,r.state==='OPEN'?'purple':r.state==='SHOT'||r.state==='POSTED'?'green':'')}</td><td><button class="text-button" data-work="${esc(r.id)}" aria-label="Open ${esc(r.id)}">${icon('up')}</button></td></tr>`).join('')}</tbody></table></div>`}
function campaignCards(plans){return `<div class="campaign-grid">${plans.length?plans.map(p=>`<button class="campaign" data-plan="${esc(p.path)}"><div class="campaign-top">${icon('folder')}${tag(p.template?'Reusable outline':'Campaign plan',p.template?'':'purple')}</div><h3>${esc(p.title)}</h3><p>${esc(p.summary||'Open the campaign outline and source plan.')}</p><div class="campaign-footer"><span>${p.outline.length} sections · ${shortDate(p.date)}</span><span>View outline ↗</span></div></button>`).join(''):'<div class="empty">No campaign plans found.</div>'}</div>`}
function overview(){const c=data.counts,ready=data.posts.filter(p=>p.status==='READY'||p.status==='APPROVED'),unused=data.ideas.filter(i=>i.status==='UNUSED').length;return heading('The marketing studio.','Your ideas, campaigns and AI team. One clear view.',runButton('publisher','Create LinkedIn drafts'))+
`<div class="stats">${[['Active ideas',c.ideas,`${unused} available to develop`,'spark','ideas','all'],['In production',c.open,`${c.overdue} past their delivery date`,'board','production','open'],['Awaiting review',c.ready,`${c.approved} approved · ready to publish`,'doc','publishing','READY'],['Published',c.posted,'Recorded in your publishing queue','send','publishing','POSTED']].map(([label,n,foot,i,v,f])=>`<button class="stat" data-nav="${v}" data-filter="${f}"><div class="stat-top">${label}${icon(i)}</div><div class="stat-num">${n}</div><div class="stat-foot ${v==='production'&&c.overdue?'warn':''}">${foot}</div></button>`).join('')}</div>
<div class="layout"><div>${sectionHead('A clear path from idea to published',tag('Your workflow'))}<div class="flow"><div class="flow-head">${icon('orbit')}One department. Every stage connected.</div><div class="flow-stages">${[['spark','Discover',`${unused} unused ideas`,'ideas','UNUSED'],['board','Create',`${c.open} open orders`,'production','open'],['doc','Review',`${c.ready} posts ready`,'publishing','READY'],['check','Publish',`${c.posted} recorded posts`,'publishing','POSTED']].map(([i,title,sub,v,f])=>`<button class="stage" data-nav="${v}" data-filter="${f}"><span class="stage-icon">${icon(i)}</span><strong>${title}</strong><small>${sub}</small></button>`).join('')}</div><div class="flow-caption">Ideas and orders come from your department. Publishing stays in your hands.</div></div>
${sectionHead('Production, by priority',go('View all orders','production'))}${workTable(sortedWork().filter(r=>r.state==='OPEN').slice(0,5))}
${sectionHead('Campaign outlines',go('Explore plans','campaigns'))}${campaignCards(data.plans.slice(0,2))}</div>
<aside class="rail"><div class="panel">${sectionHead('On your desk',tag(`${ready.length} posts`,'purple'))}${ready.slice(0,3).map(p=>`<div class="desk-item"><button data-post="${esc(p.id)}">${esc(p.idea)}</button><div class="desk-meta">${tag(p.status==='READY'?'Review draft':'Approved',p.status==='READY'?'purple':'green')}<span>${p.id} · ${shortDate(p.date)}</span></div></div>`).join('')||'<p>No posts waiting for review.</p>'}<div style="margin-top:17px">${go('Open publishing queue','publishing')}</div></div>
<div class="panel tint"><div class="round-icon">${icon('spark')}</div><h3>Your AI department</h3><p>${data.roles.length} specialist roles, from market research to a finished draft.</p>${go('Meet your team','team')}<div class="run-info"><small>NEXT SCHEDULED RUN · DUBAI</small><strong>${esc(data.next?.label||'On demand')}</strong><small>${time(data.next?.at)}</small></div><div class="run-info"><small>LATEST REPORT · ${esc(data.report.date||'Not available')}</small><strong>${esc(data.report.status.split('(')[0].trim())}</strong><p style="margin:5px 0 0">${data.report.status.startsWith('partial')?'Some inputs were unavailable. Open the report for details.':'Open the report for findings and decisions.'}</p><a class="text-button" style="margin-top:9px" href="${source('live/report.md')}" target="_blank" rel="noopener">Read department report ${icon('up')}</a></div></div>
<div class="panel handoffs"><h3>Connected to the floor</h3><p>Inputs from the teams closest to your buyers.</p>${data.handoffs.map(h=>`<div class="desk-item">${h.available?`<a class="text-button" href="${esc(source(h.path,h.dept))}" target="_blank" rel="noopener">${esc(h.name)} ${icon('up')}</a>`:`<span class="muted">${esc(h.name)} · unavailable</span>`}<div class="desk-meta">${h.date?shortDate(h.date):'No dated handoff'}</div></div>`).join('')}</div></aside></div>`}
function filterButtons(items){return `<div class="filters">${items.map(([id,label])=>`<button class="filter ${filter===id?'active':''}" data-set-filter="${id}">${label}</button>`).join('')}</div>`}
function production(){let rows=sortedWork().filter(r=>filter==='all'||filter==='open'&&r.state==='OPEN'||filter==='overdue'&&r.overdue||filter==='unassigned'&&r.unassigned&&r.state==='OPEN');return heading('Make the next move.','Work orders, delivery dates and owners, without the back-and-forth.',runButton('marketing','Prepare production orders'))+filterButtons([['all','All orders'],['open',`Open · ${data.counts.open}`],['overdue',`Overdue · ${data.counts.overdue}`],['unassigned',`Needs owner · ${data.counts.unassigned}`]])+workTable(rows)}
function ideas(){const rows=data.ideas.filter(match).filter(i=>filter==='all'||i.status===filter);return heading('The idea bank.','Evidence, angles and hooks for the next piece worth making.',link('Open source','live/ideas.md'))+filterButtons([['all','All ideas'],['UNUSED','Unused'],['IN PLAN','In a plan'],['SELECTED','Selected'],['HOLD','On hold'],['DROPPED','Dropped']])+`<div class="cards">${rows.map(i=>`<button class="idea" data-idea="${esc(i.name)}"><div>${tag(i.status,i.status==='IN PLAN'?'purple':i.status==='HOLD'?'amber':'')}</div><h3>${esc(i.name)}</h3><p>${esc(i.hook)}</p><small>${shortDate(i.date)} · Open creative outline ↗</small></button>`).join('')||'<div class="empty">No ideas match this view.</div>'}</div>`}
function campaigns(){return heading('Campaigns with a plan.','Audience, channels, timing and the details that still need a decision.',link('Open plan library','live/plans','marketing',true))+campaignCards(data.plans.filter(match))}
function team(){return heading('A department of specialists.','Research to production, connected to the way your business works.',`<a class="button" href="/graph">${icon('orbit')}Open knowledge graph</a>`)+`<div class="roles">${data.roles.filter(match).map((r,i)=>`<article class="role"><div class="role-head">${icon(['search','spark','folder','board','doc','send','grid'][i%7])}<h3>${esc(r.name)}</h3></div><p>${esc(r.description)}</p><div class="schedule">${icon('clock')} ${r.next?`${esc(r.next.label)} · ${time(r.next.at)}`:'On demand · open the role brief to get started'}</div><div class="links">${link('Role brief',r.recipe)}${link('Output',r.output,'marketing',r.directory)}${r.job?runButton(r.job,r.job==='publisher'?'Create drafts':'Prepare orders'):''}</div></article>`).join('')||'<div class="empty">No roles match your search.</div>'}</div>`}
function publishing(){const rows=data.posts.filter(match).filter(p=>filter==='all'||p.status===filter);return heading('Ready for your voice.','Review the draft, then continue to your publishing controls.',runButton('publisher','Create LinkedIn drafts'))+filterButtons([['all','All posts'],['READY','Ready for review'],['APPROVED','Approved'],['POSTED','Posted'],['REJECTED','Rejected']])+`<div class="cards">${rows.map(p=>`<button class="idea" data-post="${esc(p.id)}"><div>${tag(p.status,p.status==='POSTED'?'green':'purple')}</div><h3>${esc(p.idea)}</h3><p>${esc(p.body.slice(0,170))}${p.body.length>170?'…':''}</p><small>${p.id} · ${esc(p.channel)} · ${shortDate(p.date)}</small></button>`).join('')||'<div class="empty">No posts match this view.</div>'}</div>`}
function searchResults(){const groups=[['Production orders',data.production.filter(match),(r)=>`data-work="${esc(r.id)}"`,r=>r.name],['Ideas',data.ideas.filter(match),r=>`data-idea="${esc(r.name)}"`,r=>r.name],['Campaign outlines',data.plans.filter(match),r=>`data-plan="${esc(r.path)}"`,r=>r.title],['Publishing queue',data.posts.filter(match),r=>`data-post="${esc(r.id)}"`,r=>r.idea]];return heading('Find your next move.',`Results for “${esc(query)}”`)+groups.map(([name,items,attrs,title])=>items.length?sectionHead(`${name} · ${items.length}`)+`<div class="panel">${items.slice(0,20).map(r=>`<div class="desk-item"><button ${attrs(r)}>${esc(title(r))} ↗</button></div>`).join('')}</div>`:'').join('')+(groups.every(g=>!g[1].length)?'<div class="empty">No matches. Try a campaign, order ID or topic.</div>':'')}
function render(){if(!data)return;nav();const missing=Object.entries(data.sources).filter(([,v])=>!v).map(([k])=>k);$('#content').innerHTML=(offline?'<div class="notice" role="alert">Connection interrupted. Showing the last loaded data. <button data-refresh>Try again</button></div>':'')+(missing.length?`<div class="notice">Some sources are unavailable: ${esc(missing.join(', '))}. Counts may be incomplete.</div>`:'')+(query?searchResults():({overview,production,ideas,campaigns,team,publishing}[view]||overview)())+`<footer class="page-footer"><span><span class="dot live-dot"></span> ${offline?'Last loaded':'Updated'} ${time(data.checked)} · Dubai time</span><span><a href="/graph">Knowledge graph ↗</a> &nbsp; · &nbsp; <button class="text-button" data-refresh>Refresh</button></span></footer>`}
function openDetail(type,title,body){$('#detail-type').textContent=type;$('#detail-body').innerHTML=`<h2 id="detail-title">${esc(title)}</h2>${body}`;if(!$('#detail').open)$('#detail').showModal()}
function showWork(id){const r=data.production.find(r=>r.id===id);if(!r)return;openDetail(`Production / ${r.id}`,r.name,`${tag(r.state,'purple')}<div class="detail-grid"><div><small>Owner</small><span>${esc(r.unassigned?'Not assigned':r.owner)}</span></div><div><small>Delivery date</small><span>${shortDate(r.due)}${r.overdue?' · Overdue':''}</span></div><div><small>Channel</small><span>${esc(r.channel)}</span></div><div><small>Format</small><span>${esc(r.type==='video'?'Video':'Placement')}</span></div></div><div class="eyebrow">Work order notes</div><p>${esc(r.result||'No additional notes recorded.')}</p><div class="dialog-actions">${link('Open production source','live/production.md')}${link('Scripts & shot lists','live/production','marketing',true)}</div>`)}
function showIdea(name){const i=data.ideas.find(i=>i.name===name);if(!i)return;openDetail('Creative outline',i.name,`${tag(i.status,'purple')}<p style="font:20px/1.6 var(--serif)">${esc(i.hook)}</p><div class="eyebrow">Audience / channel / format</div><p>${esc(i.audience)}</p><div class="eyebrow">Evidence</div><p>${esc(i.proof)}</p><div class="eyebrow">Budget & next steps</div><p>${esc(i.cost)}<br>${esc(i.result||'No next step recorded.')}</p><div class="dialog-actions">${link('Open idea bank','live/ideas.md')}</div>`)}
function showPlan(path){const p=data.plans.find(p=>p.path===path);if(!p)return;openDetail('Campaign outline',p.title,`<p>${esc(p.summary)}</p>${p.blanks?`<div class="notice">${p.blanks} placeholders remain in the source plan. Open the plan to review the missing details.</div>`:''}<ol class="outline">${p.outline.map(h=>`<li>${esc(h.replace(/^\d+\.\s*/,''))}</li>`).join('')}</ol><div class="dialog-actions">${link('Open full plan',p.path)}${link('Marketing actions','live/actions.md')}</div>`)}
function showPost(id){const p=data.posts.find(p=>p.id===id);if(!p)return;openDetail(`Publishing / ${p.id}`,p.idea,`${tag(p.status,p.status==='POSTED'?'green':'purple')}<p>${esc(p.channel)} · Drafted ${shortDate(p.date)}</p><div class="post-body">${esc(p.body||'No post body found. Open the source draft.')}</div><div class="dialog-actions"><button class="button" data-copy="${p.id}">Copy draft</button>${link('Open draft',`live/posts/${p.id}.md`)}${p.carousel?`<a class="button" href="/post-file?f=${p.id}-carousel.pdf" target="_blank" rel="noopener">Open carousel ↗</a>`:''}<a class="button primary" href="/#publishing" target="_blank" rel="noopener">Publishing controls ${icon('up')}</a></div><p style="font-size:11px">Review and approve on the department board. You choose when to post.</p>`)}
function confirmRun(job){if(!data.jobs[job])return;const publisher=job==='publisher';openDetail('AI department',publisher?'Create LinkedIn drafts':'Prepare production orders',`<p>${publisher?'The publisher will use your selected ideas and department context to prepare drafts in the publishing queue.':'The production director will prepare work orders, scripts and shot lists from your department context.'}</p><p>Usually takes 5–10 minutes. You can keep working while it runs.</p><div class="dialog-actions"><button class="button primary" data-start="${job}">${icon('spark')}Start ${publisher?'drafting':'production run'}</button><button class="button" data-close>Cancel</button></div>`)}
async function startJob(job){if(pending.has(job))return;pending.add(job);$('#detail').close();render();try{const r=await fetch('/run/'+encodeURIComponent(job),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Request not accepted');const result=await r.json();if(!result.ok)throw Error(result.why||'Run not started');toast('Your AI role has started. Progress will update here.');await refresh()}catch(e){toast('Could not confirm the run. Refresh status before trying again.')}finally{pending.delete(job);render()}}
async function refresh(){if(loading||document.hidden)return;loading=true;try{const r=await fetch('/marketing-data',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('Unavailable');const next=await r.json();if(!Array.isArray(next.production)||!next.counts)throw Error('Invalid data');data=next;offline=false;render()}catch(e){offline=true;if(data)render();else $('#content').innerHTML='<div class="empty" role="alert">The workspace could not load.<br><button class="button" data-refresh style="margin-top:15px">Try again</button></div>'}finally{loading=false}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){navigate(d.nav,d.filter||'all')}else if(d.setFilter){filter=d.setFilter;render()}else if(d.work)showWork(d.work);else if(d.idea)showIdea(d.idea);else if(d.plan)showPlan(d.plan);else if(d.post)showPost(d.post);else if(d.run)confirmRun(d.run);else if(d.start)startJob(d.start);else if('close'in d)$('#detail').close();else if('refresh'in d)refresh();else if(d.copy){try{await navigator.clipboard.writeText(data.posts.find(p=>p.id===d.copy).body);toast('Draft copied')}catch(e){toast('Copy unavailable. Select the draft text to copy it.')}}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&!$('#detail').open){$('#search').value='';query='';render()}});
$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#detail').close()}});
$('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Dubai'});nav();refresh();setInterval(()=>{if(!$('#detail').open)refresh()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
